version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/niazleushkin/kino/internal/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: internal/gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: internal/gen
    opt: paths=source_relative
  # Плагины на других языках добавляются сюда же — полиглотность
  # начинается с генерации из одной схемы (ADR-0001).
