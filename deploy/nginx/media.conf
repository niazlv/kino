# ВНИМАНИЕ: этот конфиг НЕ применяется к выкачке с CDN площадки.
#
# CDN режет по JA3/JA4-отпечатку, а nginx поверх OpenSSL предъявляет ровно
# тот, который душат. Апстрим-запросы делает сам gateway браузерным
# транспортом (pkg/browserhttp). См. раздел «TLS-отпечаток» в ADR-0003.
#
# Конфиг остаётся полезен для DELIVERY_MODE_LOCAL — отдачи уже скачанного
# и ремукснутого с локального диска, где нет ни CDN, ни отпечатка.

proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:64m
                 max_size=20g inactive=24h use_temp_path=off;

server {
    listen 8083;

    # internal — снаружи не дёрнуть, только через X-Accel-Redirect от gateway.
    location /__upstream/ {
        internal;

        set $upstream_url $upstream_http_x_upstream_url;
        proxy_pass $upstream_url;

        proxy_cache media;
        proxy_cache_valid 200 206 12h;
        proxy_cache_lock on;
        slice 1m;
        proxy_set_header Range $slice_range;

        # Редиректы наружу разрешать нельзя: allowed_origins проверяет
        # gateway ДО выдачи X-Accel-Redirect (защита от SSRF).
        proxy_redirect off;
        proxy_intercept_errors on;
    }
}
