# Проверка секретов: gitleaks dir . (или git) берёт этот файл сам.
# Правила по умолчанию + известные ложные срабатывания: в записанных ответах
# площадок (providers/*/testdata) поля token_movie, seriesKey, key и подобные —
# шестнадцатеричные идентификаторы тайтлов и серий, а не ключи. Настоящие
# ключи и токены в testdata заменяются фиктивными (fixture…).
#
# Исключение — по имени поля И виду значения, без привязки к пути: в gitleaks
# 8.30 при проверке каталога путь в [[allowlists]] срабатывает сам по себе,
# даже с condition = "AND", и глушил бы любой ключ в testdata.
[extend]
useDefault = true

[[allowlists]]
description = "идентификаторы тайтлов и серий в ответах площадок"
regexTarget = "match"
regexes = ['''(?i)^(token_movie|serieskey|currentepisodekey|data-key|key)["']?\s*[:=]\s*["']?[0-9a-f]{24,40}["']?$''']
