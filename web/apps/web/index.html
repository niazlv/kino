<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1116" />
    <meta name="robots" content="noindex" />
    <!-- Знак — билет на зелёной плашке. Источник в docs/design/icon/gen.py;
         файлы в public/ пересобираются командой `python3 docs/design/icon/gen.py --export`. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- С экрана телефона открывается как приложение, без адресной строки.
         Сессия у такого окна своя: после добавления на экран войти придётся ещё раз. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="kino" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>kino</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
